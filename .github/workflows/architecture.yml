name: architecture CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: veryl-lang/setup-verilator@v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfl2 libfl-dev

      - name: Run Verilator Build
        run: |
          verilator -Wall --cc --exe --build --top-module top sim/sim_main.cpp rtl/*.v memory/*.v rom/*.v alu/*.v

      - name: Run Simulation
        run: |
          ./obj_dir/Vtop
